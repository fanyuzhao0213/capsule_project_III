<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">磁控胶囊内窥镜图像链路板卡模块框图</title>
  <desc id="desc">胶囊板包含 OV7676、CX93510 和 nRF TX；经 2.4GHz 无线发送到图像记录仪板的 nRF RX；STM32 接收后分别写 SD 卡和发送至板外 PC。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#087F8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="wireless" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L10 5.5 L1 10" fill="none" stroke="#B36A27" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#173342}
      .group{font-size:29px;font-weight:700}
      .groupSub{font-size:17px;fill:#54717E}
      .moduleTitle{font-size:27px;font-weight:700}
      .moduleSub{font-size:18px;fill:#41606D}
      .label{font-size:17px;font-weight:700;fill:#087F8C}
      .note{font-size:18px;fill:#54717E}
      .wireLabel{font-size:19px;font-weight:700;fill:#A05B20}
      .line{stroke:#087F8C;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="640" fill="#FFFFFF"/>
  <!-- Two physical boards -->
  <rect x="26" y="20" width="722" height="490" rx="20" fill="#F1F8FA" stroke="#AFCBD1" stroke-width="2"/>
  <rect x="852" y="20" width="722" height="490" rx="20" fill="#F3F7F9" stroke="#AFCBD1" stroke-width="2"/>
  <rect x="52" y="43" width="12" height="55" rx="6" fill="#087F8C"/>
  <text class="group" x="82" y="71">胶囊板 · TX</text>
  <text class="groupSub" x="82" y="99">图像采集 → JPEG 编码 → 无线发送</text>
  <rect x="878" y="43" width="12" height="55" rx="6" fill="#087F8C"/>
  <text class="group" x="908" y="71">图像记录仪板 · RX / STM32</text>
  <text class="groupSub" x="908" y="99">无线接收 → 帧校验 → 本地保存 / PC 转发</text>

  <!-- Capsule board modules -->
  <rect x="66" y="168" width="174" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="66" y="168" width="174" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="86" y="225">OV7676</text>
  <text class="moduleSub" x="86" y="267">图像传感器</text>
  <text class="moduleSub" x="86" y="301">480 × 480</text>
  <text class="moduleSub" x="86" y="335">YUV422 像素</text>

  <rect x="302" y="168" width="202" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="302" y="168" width="202" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="322" y="225">CX93510</text>
  <text class="moduleSub" x="322" y="267">DVP 同步采集</text>
  <text class="moduleSub" x="322" y="301">JPEG 压缩</text>
  <text class="moduleSub" x="322" y="335">帧 RAM 缓存</text>

  <rect x="566" y="168" width="160" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="566" y="168" width="160" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="586" y="225">nRF TX</text>
  <text class="moduleSub" x="586" y="267">SPI 读 JPEG</text>
  <text class="moduleSub" x="586" y="301">无线包分片</text>
  <text class="moduleSub" x="586" y="335">发送</text>

  <!-- Recorder board modules -->
  <rect x="880" y="168" width="177" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="880" y="168" width="177" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="900" y="225">nRF RX</text>
  <text class="moduleSub" x="900" y="267">12 路天线选路</text>
  <text class="moduleSub" x="900" y="301">无线收包</text>
  <text class="moduleSub" x="900" y="335">UART 转发</text>

  <rect x="1117" y="168" width="204" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="1117" y="168" width="204" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="1137" y="225">STM32</text>
  <text class="moduleSub" x="1137" y="267">解析 / 校验</text>
  <text class="moduleSub" x="1137" y="301">补 DeviceInfo</text>
  <text class="moduleSub" x="1137" y="335">PC / SD 分流</text>

  <rect x="1381" y="168" width="160" height="212" rx="16" fill="#FFFFFF" stroke="#B5CED4" stroke-width="2"/>
  <rect x="1381" y="168" width="160" height="10" rx="5" fill="#087F8C"/>
  <text class="moduleTitle" x="1401" y="225">SD 卡</text>
  <text class="moduleSub" x="1401" y="267">.YS 记录</text>
  <text class="moduleSub" x="1401" y="301">20064 B / 条</text>
  <text class="moduleSub" x="1401" y="335">每 10 条同步</text>

  <!-- Interfaces and data direction -->
  <path class="line" d="M242 276 H296"/>
  <text class="label" x="249" y="252">DVP</text>
  <path class="line" d="M506 276 H560"/>
  <text class="label" x="514" y="252">SPI</text>
  <path d="M728 276 H873" stroke="#B36A27" stroke-width="3.5" fill="none" marker-end="url(#wireless)"/>
  <text class="wireLabel" x="747" y="247">2.4 GHz</text>
  <text class="wireLabel" x="764" y="312">无线</text>
  <path class="line" d="M1059 276 H1111"/>
  <text class="label" x="1062" y="252">UART</text>
  <path class="line" d="M1323 276 H1375"/>
  <text class="label" x="1335" y="252">SD</text>

  <!-- Board-level notes -->
  <text class="note" x="68" y="439">nRF 发送 DATA 分片时，从 CX93510 帧 RAM 按需取数</text>
  <text class="note" x="881" y="439">校验通过后分两路输出</text>

  <!-- External PC -->
  <path class="line" d="M1219 382 V541"/>
  <rect x="1099" y="548" width="240" height="70" rx="14" fill="#E8F2F4" stroke="#8DBAC2" stroke-width="2"/>
  <text class="moduleTitle" x="1122" y="592">PC 上位机</text>
  <text class="label" x="1239" y="519">USART3</text>
</svg>
